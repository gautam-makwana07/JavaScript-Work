<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Professional Task Manager</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", sans-serif;
      }

      body {
        background: linear-gradient(135deg, #141414, #1f1f1f);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        color: #fff;
      }

      .container {
        width: 100%;
        max-width: 420px;
        background: #1c1c1c;
        padding: 30px;
        border-radius: 18px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
      }

      h1 {
        text-align: center;
        margin-bottom: 25px;
        font-weight: 600;
      }

      .input-group {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
      }

      .input-group input {
        flex: 1;
        padding: 12px;
        border-radius: 10px;
        border: none;
        background: #2c2c2c;
        color: #fff;
      }

      .input-group input:focus {
        outline: 2px solid #4caf50;
      }

      .add-btn {
        padding: 12px 18px;
        border: none;
        border-radius: 10px;
        background: #4caf50;
        color: white;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
      }

      .add-btn:hover {
        background: #43a047;
      }

      .task-list {
        list-style: none;
      }

      .task-list li {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: #2c2c2c;
        padding: 12px 15px;
        border-radius: 10px;
        margin-bottom: 10px;
        transition: 0.3s;
      }

      .task-left {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .task-left input[type="checkbox"] {
        width: 18px;
        height: 18px;
        cursor: pointer;
        accent-color: #4caf50;
      }

      .task-text.completed {
        text-decoration: line-through;
        opacity: 0.6;
      }

      .delete-btn {
        background: transparent;
        border: none;
        color: #ff4d4d;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
      }

      .delete-btn:hover {
        color: #ff1a1a;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>Task Manager</h1>

      <div class="input-group">
        <input type="text" id="taskInput" placeholder="Add a new task..." />
        <button class="add-btn">Add</button>
      </div>

      <ul class="task-list" id="taskList"></ul>
    </div>

    <script src="ToDolist.js"></script>
  </body>
</html>
