<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Premium Offer & Downloader</title>
    <style>
        :root {
            --primary-red: #800000;
            --bg-dark: #0f172a;
            --glass: rgba(255, 255, 255, 0.95);
        }

        body {
            background-color: var(--bg-dark);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        /* Modal Styles - Hidden by default */
        .modal-card {
            display: none; 
            position: fixed;
            background-color: var(--glass);
            width: 90%;
            max-width: 400px;
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
            z-index: 100;
            animation: fadeIn 0.5s ease-out;
        }

        .title {
            color: var(--primary-red);
            font-size: 1.8rem;
            margin: 0 0 15px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .image-container img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .price-section {
            font-size: 1.4rem;
            margin: 20px 0;
        }

        .old-price {
            text-decoration: line-through;
            color: #94a3b8;
            font-size: 1.1rem;
        }

        .new-price {
            color: #1e293b;
            font-weight: 800;
            margin-left: 10px;
        }

        .close-btn {
            background-color: #1e293b;
            color: white;
            border: none;
            padding: 12px 40px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }

        .close-btn:hover {
            background-color: #334155;
            transform: translateY(-2px);
        }

        /* Loader Styles */
        .download-container {
            width: 350px;
            text-align: center;
            color: white;
        }

        .progress-track {
            height: 12px;
            width: 100%;
            background-color: #334155;
            border-radius: 10px;
            overflow: hidden;
            margin: 15px 0;
        }

        .progress-bar {
            height: 100%;
            width: 0%; /* Start at 0 */
            background: linear-gradient(90deg, #3b82f6, #2dd4bf);
            transition: width 0.1s linear;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="download-container" id="download-zone">
        <h2 id="status-text">Downloading Assets...</h2>
        <div class="progress-track">
            <div class="progress-bar" id="bar"></div>
        </div>
        <p class="percent" id="percent-text">0%</p>
    </div>

    <div class="modal-card" id="offer-modal">
        <h2 class="title">Exclusive Offer</h2>
        <div class="image-container">
            <img src="https://i.pinimg.com/736x/e3/06/d1/e306d1537eb21119449172c2a08915d1.jpg" alt="Luxury Watch">
        </div>
        <p>Premium craftsmanship. Limited edition release.</p>
        <div class="price-section">
            <span class="old-price">₹5,00,000</span>
            <span class="new-price">₹4,80,000</span>
        </div>
        <button class="close-btn" id="close-modal">Claim Offer</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
