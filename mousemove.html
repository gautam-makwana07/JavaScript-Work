<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MouseMove Effect</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .box{
            width: 10px;
            height: 10px;
            background-color: red;
            transition: cubic-bezier(0.68, -0.55, 0.265, 1.55) 1s;
            border: 2px solid black;
            border-radius: 50px;
            position: absolute;
        }
        
    </style>
</head>
<body>
    
    <div class="box"></div>

    <script src="mousemove.js"></script>
</body>
</html>
